# 访问统计汇总（方案 §11 路线 B）
#
#   访客 → /api/hit（Vercel 函数）→ Upstash Redis 计数
#                                        ↓ 就是这个 Action（跑在境外，无跨境问题）
#                                   私有仓库的 stats.json
#                                        ↓ 后台「访问统计」页读它画图（零跨境）
#
# 需要在仓库 Settings → Secrets and variables → Actions 里加（都是 Actions secrets）：
#   UPSTASH_REDIS_REST_URL    Upstash 的 REST 地址（和限流用的是同一个库）
#   UPSTASH_REDIS_REST_TOKEN  同上（读写 token）
#   STATS_TOKEN               能写私有仓库 hjphh11/qingwu-link-applications 的 PAT
#                             （Contents: Read and write；可以直接复用友链申请那个 APPLY_TOKEN）
#
# 数据落在**私有仓库**：来源 / 地区 / 设备这些分析数据不公开，也不会给博客仓库造提交、
# 不触发 Vercel 重建。
name: 统计汇总

on:
  schedule:
    # 每 6 小时一次（错开整点，别和别的高峰挤一起）
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch: {} # 想立刻刷新就在 Actions 页面点一下

permissions:
  contents: read # 只读本仓库（统计写的是私有仓库，用 STATS_TOKEN）

concurrency:
  group: stats-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      # v5 起官方 action 用 Node 24 运行，省掉「Node 20 is deprecated」那条警告
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 先把「缺哪个」一次列清楚，再去打 API。
      # 这步专门防两种踩过的坑：① secret 名字写错（比如把值粘进了 Name 框）；
      #                        ② 加到了 Variables 标签页而不是 Secrets（读出来会是空字符串、还不报错）。
      # 只报**名字**，绝不打印任何值。
      - name: 自检：三个 secrets 在不在
        env:
          S_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          S_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          S_STATS: ${{ secrets.STATS_TOKEN }}
        run: |
          missing=""
          if [ -z "$S_URL" ]; then missing="$missing UPSTASH_REDIS_REST_URL"; fi
          if [ -z "$S_TOKEN" ]; then missing="$missing UPSTASH_REDIS_REST_TOKEN"; fi
          if [ -z "$S_STATS" ]; then missing="$missing STATS_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "::error::这些 Actions secrets 读不到：$missing"
            echo "位置：本仓库 Settings → Secrets and variables → Actions → 标签页要选【Secrets】→ Repository secrets → New repository secret"
            echo "提醒：名字必须逐字符一致（全大写 + 下划线）；加到 Variables 标签页是读不到的。"
            exit 1
          fi
          echo "三个 secrets 都在 ✓（只确认有没有，不打印内容）"

      - name: 汇总并写回私有仓库
        run: node scripts/stats-collect.mjs
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_REPO: hjphh11/qingwu-link-applications
          STATS_PATH: stats.json
          STATS_REF: main
