<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-label="歌词面板以左缘为轴向右前方旋转 18 度，靠近当前句的行清晰、远处的行模糊；右下角列出四档景深参数">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B9A493"/>
    </marker>
    <marker id="a3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C23A55"/>
    </marker>
    <marker id="a3s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C9B8A6"/>
    </marker>
  </defs>

  <style>
    .t { font-family:ui-sans-serif,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:13px; font-weight:600; fill:#3A2B1F }
    .s { font-family:ui-sans-serif,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:11px; fill:#8A7561 }
    .mono { font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:11px; fill:#8A7561 }
    .monor { font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:11px; fill:#C23A55; font-weight:600 }
  </style>

  <!-- 面板：左窄右宽，表示右端被透视放大 -->
  <polygon points="190,74 690,44 690,262 190,232" fill="#FDFAF6" stroke="#E3D3C3" stroke-width="1.5"/>

  <!-- 五行歌词：上下两端的行更淡（远），中间一行实心（当前句） -->
  <line x1="214" y1="100" x2="654" y2="84" stroke="#D8C7B6" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <line x1="212" y1="132" x2="660" y2="116" stroke="#D8C7B6" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
  <line x1="210" y1="164" x2="666" y2="148" stroke="#C23A55" stroke-width="8" stroke-linecap="round"/>
  <line x1="212" y1="196" x2="660" y2="180" stroke="#D8C7B6" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
  <line x1="214" y1="228" x2="654" y2="212" stroke="#D8C7B6" stroke-width="7" stroke-linecap="round" opacity="0.45"/>

  <!-- 左侧旋转轴 -->
  <line x1="190" y1="40" x2="190" y2="290" stroke="#C23A55" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="190" cy="164" r="4" fill="#C23A55"/>
  <text class="s" x="34" y="150">transform-origin:</text>
  <text class="monor" x="34" y="168">left center</text>
  <text class="s" x="34" y="192">轴钉左缘，</text>
  <text class="s" x="34" y="208">右端往镜头前来</text>

  <!-- 旋转角度弧 -->
  <path d="M246 62 A 62 62 0 0 1 300 86" fill="none" stroke="#C23A55" stroke-width="1.4" marker-end="url(#a3r)"/>
  <text class="monor" x="258" y="54">18°</text>

  <!-- 透视标注 -->
  <path d="M706 90 H 760" stroke="#C9B8A6" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#a3s)"/>
  <text class="s" x="700" y="80">越往右越近</text>

  <!-- 右侧景深分档 -->
  <line x1="20" y1="300" x2="800" y2="300" stroke="#EFE3D6" stroke-width="1"/>
  <text class="t" x="34" y="324">景深按「离当前句多远」分档</text>

  <text class="mono" x="290" y="324">dist 1 · blur 1.2px · opacity .68</text>
  <text class="mono" x="500" y="324">dist 2 · blur 2.6px · .48</text>
  <text class="mono" x="290" y="342">dist 3 · blur 4px · .32</text>
  <text class="monor" x="500" y="342">far · blur 5.5px · .20（不参与过渡）</text>
</svg>
