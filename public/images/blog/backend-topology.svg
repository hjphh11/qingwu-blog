<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="请求路径：浏览器经 nginx 分流，静态页面直接读 dist/client，/api 反代到本机 workerd，数据存于 SQLite；GitHub 推送后由 auto-deploy 每两分钟拉取构建">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B9A493"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C23A55"/>
    </marker>
  </defs>

  <style>
    .t { font-family:ui-sans-serif,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:14px; font-weight:600; fill:#3A2B1F }
    .s { font-family:ui-sans-serif,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:11.5px; fill:#8A7561 }
    .lbl { font-family:ui-sans-serif,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:11px; fill:#8A7561 }
    .lblr { font-family:ui-sans-serif,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; font-size:11px; fill:#C23A55; font-weight:600 }
    .line { stroke:#B9A493; stroke-width:1.5; fill:none; marker-end:url(#ah) }
    .liner { stroke:#C23A55; stroke-width:1.5; fill:none; marker-end:url(#ahr) }
  </style>

  <!-- 顶行：仓库 → 自动部署 -->
  <rect x="24" y="18" width="120" height="52" rx="10" fill="#FDFAF6" stroke="#E9DCCD" stroke-width="1.5"/>
  <text class="t" x="84" y="40" text-anchor="middle">GitHub 仓库</text>
  <text class="s" x="84" y="58" text-anchor="middle">main 分支</text>

  <rect x="410" y="18" width="190" height="52" rx="10" fill="#FDFAF6" stroke="#E9DCCD" stroke-width="1.5"/>
  <text class="t" x="505" y="40" text-anchor="middle">auto-deploy</text>
  <text class="s" x="505" y="58" text-anchor="middle">每 2 分钟 pull + build</text>

  <path d="M144 44 H386" stroke="#C2B09E" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- dist/client -->
  <rect x="424" y="96" width="196" height="72" rx="12" fill="#FBF4EC" stroke="#E3D3C3" stroke-width="1.5"/>
  <text class="t" x="522" y="122" text-anchor="middle">dist/client</text>
  <text class="s" x="522" y="141" text-anchor="middle">HTML · CSS · 字体 · 图片</text>
  <text class="s" x="522" y="157" text-anchor="middle">37 个页面</text>

  <path d="M505 70 V92" stroke="#C2B09E" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)"/>

  <!-- 浏览器 -->
  <rect x="24" y="158" width="126" height="76" rx="12" fill="#FBF4EC" stroke="#E3D3C3" stroke-width="1.5"/>
  <text class="t" x="87" y="188" text-anchor="middle">浏览器</text>
  <text class="s" x="87" y="207" text-anchor="middle">qingwu.ink</text>

  <!-- nginx -->
  <rect x="208" y="140" width="140" height="112" rx="12" fill="#FBF4EC" stroke="#E3D3C3" stroke-width="1.5"/>
  <text class="t" x="278" y="167" text-anchor="middle">nginx :443</text>
  <text class="s" x="278" y="187" text-anchor="middle">静态优先</text>
  <text class="s" x="278" y="203" text-anchor="middle">/api 才转发</text>
  <text class="s" x="278" y="223" text-anchor="middle">限流 · CSP · HSTS</text>

  <path class="line" d="M150 196 H204"/>
  <text class="lbl" x="177" y="188" text-anchor="middle">HTTP/2</text>

  <path class="line" d="M348 168 H386 V126 H420"/>
  <text class="lbl" x="374" y="150" text-anchor="middle">其余</text>

  <!-- workerd -->
  <rect x="424" y="188" width="196" height="80" rx="12" fill="#FCEEF1" stroke="#E5A9B6" stroke-width="1.5"/>
  <text class="t" x="522" y="214" text-anchor="middle">workerd :8787</text>
  <text class="s" x="522" y="233" text-anchor="middle">wrangler dev --local</text>
  <text class="s" x="522" y="250" text-anchor="middle">只监听 127.0.0.1</text>

  <path class="liner" d="M348 222 H420"/>
  <text class="lblr" x="384" y="214" text-anchor="middle">/api/*</text>

  <!-- SQLite -->
  <rect x="654" y="188" width="144" height="80" rx="12" fill="#FBF4EC" stroke="#E3D3C3" stroke-width="1.5"/>
  <text class="t" x="726" y="214" text-anchor="middle">SQLite</text>
  <text class="s" x="726" y="233" text-anchor="middle">单个 .sqlite 文件</text>
  <text class="s" x="726" y="250" text-anchor="middle">统计 · 评论 · 账户</text>

  <path class="line" d="M620 228 H650"/>
</svg>
