# 清吾 · 动态运行时 Worker（Cloudflare）
#
# 方案见 docs/后台迁移-Cloudflare方案.md。
# **第 1 步只启用统计**：POST /hit（访客上报 → D1）、GET /stats（后台查询）、GET /health。
# 友链申请（第 2 步）、后台（第 3 步）、定时发布（第 4 步）、评论/点赞（第 5 步）都在后面，
# 本文件里先用注释占位，避免现在就把没写的功能打开。
#
# 部署（细节见同目录 README.md）：
#   wrangler d1 create qingwu            # 建库，把输出的 database_id 填到下面
#   wrangler d1 migrations apply qingwu --remote
#   wrangler secret put HIT_IP_SALT      # 访客匿名化用的盐（必填）
#   wrangler secret put ADMIN_STATS_TOKEN# 后台读 /stats 用的口令（可选但强烈建议）
#   wrangler deploy

name = "qingwu-api"
main = "src/index.ts"
# 打包产物类型；wrangler 直接打包 TS，不需要额外的构建步骤。
compatibility_date = "2025-04-01"

# ——— 自定义域名 ———
# workers.dev 在中国大陆访问不稳（实测 TCP 443 超时），给 Worker 绑自己 zone 上的域名。
# 注意：routes 必须放在**顶层**（不能落在 [vars] 等表段里，否则会被当成普通变量）。
#
# ⚠️ 自建（香港机）之后这里是**注释掉的**，原因是 `wrangler dev` 会按这条路由改写 Host：
#    nginx 传的 `Host: qingwu.ink` 到达 Worker 后变成 `api.qingwu.ink`，
#    连带同源请求的 `Origin` 也被改写成 `http://api.qingwu.ink`，于是来源校验全判非法、
#    打点静默归零（2026-11-10 实测确认）。
#    只有在需要重新 `wrangler deploy` 到 Cloudflare 时才恢复下面这段。
# routes = [
#   { pattern = "api.qingwu.ink", custom_domain = true }
# ]
# nodejs_compat 现在用不到（代码里只用 Web 标准 API）；将来第 3 步要跑 git/加密库时再打开。
# compatibility_flags = ["nodejs_compat"]

# ——— D1：统计数据的落点 ———
[[d1_databases]]
binding = "DB" # 代码里 env.DB
database_name = "qingwu"
# ⚠️ 手工步骤：`wrangler d1 create qingwu` 之后把真实 id 填进来（见 README.md）
database_id = "b4bba833-5587-4cd0-bf7a-316913933adf"
# 本地 `wrangler dev` 会用 .wrangler/state 下的本地 SQLite 复刻这份 schema；
# migrations_dir 让 `wrangler d1 migrations apply` 知道去哪找建表 SQL。
migrations_dir = "migrations"

# ——— R2：先占位，第 1 步不用 ———
# 方案里 R2 只服务「后台私有资源 + 备份」（公开媒体继续留国内节点）。
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "qingwu-private"

# ——— Cron：友链「最近更新」探测 ———
# 每天 UTC 03:00（北京时间 11:00）跑一轮，抓各站 RSS/sitemap 的最后日期。
# 这不是唯一入口：/link-stats 发现上一轮超过 12 小时，也会在后台顺手补一轮，
# 所以首次部署不用等到第二天。
[triggers]
crons = ["0 3 * * *"]

[vars]
# 允许跨源调用 /hit 的站点（逗号分隔；* 表示不限制）。
# 站点默认走**同源 /api/hit 薄转发**，所以正常情况下用不到 CORS；
# 这里留着是为了「哪天想让浏览器直连 Worker」时不用改代码。
ALLOWED_ORIGINS = "https://qingwu.ink,https://www.qingwu.ink,http://localhost:4321"
# /stats 响应里回显的「数据来源」信息。纯展示字段，后台前端用它显示一行说明。
# 配了它，后台统计页会显示「数据来源：Cloudflare D1（访客）」，而不是旧的 GitHub 仓库路径。
STATS_SOURCE_REPO = "cloudflare-d1"
STATS_SOURCE_PATH = "hits"
# 发件人。域名 qingwu.ink 已在 Resend 验证（status: verified / sending enabled），
# 同域名下 noreply@ / hello@ 这类地址不需要真实存在信箱，只是信封上的名字。
# 改这里之后要重新 `wrangler deploy`；RESEND_KEY / MAIL_TO 是 secret，用 `wrangler secret put` 配。
MAIL_FROM = "清吾 <noreply@qingwu.ink>"

# ——— 统一身份（登录 / 绑定）———
# 设计见 docs/方案-统一身份-登录与绑定.md，表结构见 migrations/0023_accounts.sql。
#
# 未登录能不能留言：on（默认）＝只能读，提交返回 401 login_required；
# 想退回游客也能发，改成 "off" 重启即可，不用改代码。
REQUIRE_LOGIN = "on"
# 过渡期：统一会话表里查不到管理员时回落旧 admin_sessions。
# 后台迁移稳定后改成 "0"，旧的 0013 那三张表就可以只读留档了。
AUTH_LEGACY_ADMIN = "1"
# GitHub OAuth App 的 client id 不是密钥，写这儿；client secret 用
#   wrangler secret put GITHUB_CLIENT_SECRET
# 回调地址必须与 OAuth App 里登记的完全一致：
#   https://www.qingwu.ink/api/auth/github/callback
# 没配 client id 时前台不显示 GitHub 按钮（邮箱通道照常可用）。
# GITHUB_CLIENT_ID = "Ov23li…"


# ——— AI：writer（写作）+ judge（判断）双通道 ———
# 只有 **key 是 secret**：`wrangler secret put AI_API_KEY`，本机写 .dev.vars。
# 地址、模型名、配额都不敏感，写在这里，改完 `wrangler deploy` / 重启即可。
#
# judge 通道有两种接法，由 AI_JUDGE_PROVIDER 决定：
#
#   （默认，不写）→ openai：走 DeepSeek 的 JSON 模式，和 writer 共用一个 key，零成本起步
#   "jev"         → 走 TypeSafe 的 Jev 决策模型（POST https://api.typesafe.ai/v1/systemone）
#                   它不是聊天模型：不生成文字，只回答你定义好的 typed questions，
#                   回 label + confidence。**输出不计费**、$0.042/Mtok 输入（一条留言
#                   约 400 token ≈ 0.00002 美元），实测 334ms，所以「每条评论都过一遍」
#                   真的负担得起。key 在 console.typesafe.ai/keys 领，`apikey_` 开头。
#
# 配了 jev 但没给 AI_JUDGE_KEY 时会自动回落 openai —— 不会把判断功能整挂。
# writer 完全不受 judge 怎么配的影响，这也是「一个判断模型 + 一个评论模型」的落地方式。
#
# ⚠️⚠️ 两个已经踩过的坑，改这段前务必读：
#
#   ① **端点必须是 api.typesafe.ai**。`jevmodel.io` 是个仿站，它的文档写着
#      「key 必须 sk- 开头」，于是从官方控制台拿的 `apikey_…` 永远被判 401
#      Invalid API key —— 看起来像 key 坏了，其实是打错了门。2026-11-10 白折腾一轮。
#
#   ② **TypeSafe 对中国大陆 IP 返回 451**（"not available in your region"）。
#      香港机实测可用，所以 Worker 跑在香港没问题；但本机 `npm run dev` 若走
#      大陆出口，AI 体检会 451 —— 那是地区，不是配置错。
AI_JUDGE_PROVIDER = "jev"
# 下面两项不用写 —— 代码里已有同样的默认值，写在这儿只是留个可改的位置。
# AI_JUDGE_BASE_URL = "https://api.typesafe.ai"
# AI_JUDGE_MODEL = "jev-latest"
AI_BASE_URL = "https://api.deepseek.com"
AI_MODEL = "deepseek-chat"
# 每通道每日调用上限。防手抖连点，也防 key 泄漏后被刷。
AI_DAILY_LIMIT = "300"

# ——— 后台「以爱弥斯身份回复」的署名 ———
# AI 起草的回复默认以这个身份发到评论区（站长也能一键切回自己）。
# 前台 `FriendsBoard` 判 AI 发言的判据是「署名等于爱弥斯」**或**「头像路径含
# images/emis/avatar」，所以要改名的话三处一起改，否则前台不再挂 AI 小标。
AI_PERSONA_NAME = "爱弥斯"
AI_PERSONA_AVATAR = "https://www.qingwu.ink/images/emis/avatar.png"
SITE_URL = "https://www.qingwu.ink"

# ——— 访客留言后小爱自动回复 ———
# 开着才叫「小爱在场」：有人留言，她看完就直接回一句，站长不用动手。
# 关掉（改成 "off"）就退回纯手动：只剩后台的「AI 起草」按钮。
#
# 她是无人值守的，所以除提示词外还有几道闸（见 admin/ai.ts 的 autoReplyTo）：
#   AUTO_REPLY_PER_GUEST   同一访客每天最多被自动回几次，默认 1。防一个人
#                          连发几条、小爱逐条陪聊刷出一屏
#   另有一道：先过 judge，判成 spam / abuse / privacy 的一律不回
#   总闸：AI_DAILY_LIMIT（每通道每日调用上限），额度用满就停手
#
# 2026-11-10 晚删掉 AUTO_REPLY_DAILY（每日总量上限）—— 站长要求不设限。
# 想临时关掉：把 off 两个字写进 AUTO_REPLY，重启 Worker 即可，不用改代码。
AUTO_REPLY = "on"
AUTO_REPLY_PER_GUEST = "1"

# ——— 本地开发：secret 放 worker/.dev.vars（已被 .gitignore 忽略）———
# HIT_IP_SALT="dev-salt"
# ADMIN_STATS_TOKEN="dev-token"
# AI_API_KEY="sk-…"
