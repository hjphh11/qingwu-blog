# 只给 worker 用的静态入口（127.0.0.1:8099）
#
# 为什么需要：worker 要把站内表情图上传到 Matrix，但它 fetch 自己的公网域名会
# 「Network connection lost」（NAT 回环被拦），80 端口又整体 301 到 https。
# 所以开一个只监听 loopback 的纯静态 server，worker 直接走
#   http://127.0.0.1:8099/images/emoji/...
# 只监听 127.0.0.1，外网连不上。
server {
    listen 127.0.0.1:8099;
    server_name _;
    root /data/qingwu/dist/client;
    access_log off;
    location / {
        try_files $uri =404;
    }
}
