# 清吾 · 通用安全响应头
#
# 服务器上的落地位置：/etc/nginx/snippets/security-headers.conf
# （站点配置里 4 处 include 它：server 级 + /_astro/ /fonts/ /images/ 三个静态目录 ——
#   nginx 的 add_header 不会「继承+叠加」，某个 location 里只要写了一条 add_header，
#   父级的全部失效，所以三个静态目录也得各自 include 一次。）
#
# ⚠️ 2026-11-14 变更：HSTS 补 includeSubDomains。
#   www 的 HSTS 原本到不了 img. / api. / emis. 三个子域（它们都只走 https，
#   但没有 HSTS 就仍可能被 SSL-strip）。确认三个子域都只提供 https 后再上这一行。
#   暂时不写 preload：preload 列表是不可逆的，等确认长期稳定再说。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 别让浏览器猜类型（尤其对 /api/ 的 JSON 和 /images/ 里的文件）
add_header X-Content-Type-Options "nosniff" always;

# 老浏览器兜底；现代浏览器认的是上面 CSP 里的 frame-ancestors
add_header X-Frame-Options "SAMEORIGIN" always;

# 跨站跳转时不泄露完整路径（站内跳转仍带 referer）
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 明确关掉这几种能力：本站一个都用不到
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 老 IE 的 XSS 过滤器会自己「猜」并且能被诱导，直接关掉（现代浏览器忽略这一行）
add_header X-XSS-Protection "0" always;
