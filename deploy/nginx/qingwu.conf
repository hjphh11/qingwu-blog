server {
    server_name qingwu.ink www.qingwu.ink;

    # 全站唯一域名是 www：apex 收到的一切（本 server 同时接两个名字）都 301 到 www。
    # 用 server 级 `if + return` 是 nginx 官方明确允许的写法（certbot 自己就生成这种），
    # 换来的是**一个 server 块 + 同一张证书**，不必为 apex 再复制一份 ssl 配置，
    # 也就避开了两个 server 块抢同一个 [::]:443 时 listen 选项要完全一致的坑。
    if ($host = qingwu.ink) {
        return 301 https://www.qingwu.ink$request_uri;
    }

    root   /data/qingwu/dist/client;
    index  index.html;

    # 版本号不外泄（默认会带 nginx/x.y.z）。错误页里的 server 签名也一起收掉
    server_tokens off;

    limit_conn conn 30;
    limit_req_status 429;
    if ($blocked_ua) { return 444; }

    # 请求体上限：本站没有任何合法的 multipart 上传，1MB 足够表单与头像
    client_max_body_size 1m;

    # ——— CSP ———
    # 2026-11-14：从「只报告」转成**强制**。
    #   · 去掉 'unsafe-eval'（全站 grep 过，没有 eval / new Function）
    #   · img-src 去掉 http:（https 页面本来就会挡掉明文图片，留着只是给攻击者开口子）
    #   · connect-src 从「任意 https」收紧到同源 + API 子域（防外带）
    #   · 加 report-uri / report-to：Worker 侧 /api/csp-report 收下并记日志
    # 万一某处内联脚本被挡：把下面两行换回
    #   Content-Security-Policy-Report-Only 并删掉 report-to，即可退回观察模式。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.qingwu.ink; media-src 'self' https:; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; report-uri /api/csp-report; report-to csp" always;
    add_header Report-To '{"group":"csp","max_age":10886400,"endpoints":[{"url":"https://www.qingwu.ink/api/csp-report"}]}' always;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml image/svg+xml application/rss+xml font/woff2;

    location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location /images/ {
    include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 后台静态页：nginx 层先过一道 Basic Auth。
    # 应用层已经有「密码 + 邮件验证码 + IP 锁」，这一层挡的是自动化扫描器 ——
    # 它们连弹窗都过不去，更走不到发验证码那一步（那一步会烧邮箱配额）。
    #
    # ⚠️ 2026-11-14：这个 location 原来**没有任何限速**（连打 20 次错误凭据
    # 全是 401，没有 429）。加 zone=admin_login（12 次/分钟）：人点不了这么快，
    # 字典一碰就 429。再配 fail2ban（jail nginx-http-auth）叠一层。
    location ^~ /admin {
        limit_req zone=admin_login burst=5 nodelay;
        auth_basic           "Qingwu Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location /api/admin/ {
        limit_req zone=admin_login burst=5 nodelay;
        auth_basic           "Qingwu Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        access_log /var/log/nginx/admin.log;
        proxy_pass http://127.0.0.1:8787/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ⚠️ 必须清掉：Worker 侧只信 x-real-ip，但历史上它优先读 cf-connecting-ip。
        # 站点已不在 Cloudflare 后面，这个头等于「客户端自己填的 IP」——
        # 不清掉的话，一个请求头就能让去重、限流、后台失败锁定全部失效。
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Q-Country $geoip2_country_code;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 见上：客户端自带的 CF-Connecting-IP 一律作废
        proxy_set_header CF-Connecting-IP "";
        # Worker 侧用它还原真实协议，决定 Set-Cookie 要不要带 Secure
        proxy_set_header X-Forwarded-Proto $scheme;
        # 访客归属地：本地 workerd 的 cf.country 恒等于本机出口地（香港），
        # 只能由 nginx 用 GeoIP 库算好交给 Worker（见 /etc/nginx/conf.d/geoip2.conf）
        proxy_set_header X-Q-Country $geoip2_country_code;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=site burst=100 nodelay;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    include /etc/nginx/snippets/security-headers.conf;
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qingwu.ink/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qingwu.ink/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# ——— 默认 443：不认识的 Host 直接拒绝握手 ———
# 以前没有 default_server，于是「IP + 任意 Host」也能拿到主站（扫描器、
# 缓存投毒、把裸 IP 当镜像站都靠它）。ssl_reject_handshake 要求 nginx ≥ 1.19.4。
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 ipv6only=on default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
}

# ——— 默认 80：只给认识的两个名字做跳转，其余直接断 ———
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name qingwu.ink www.qingwu.ink;

    # http 的域名、http 的 www 一步跳到 https://www，路径和查询串原样带过去。
    # 原来这里还有 certbot 生成的两条 `if ($host = ...) return 301 https://$host...`，
    # 已删：它们会把 qingwu.ink 先送到 apex 的 https 再跳一次 www，白白多一跳。
    return 301 https://www.qingwu.ink$request_uri;
}
