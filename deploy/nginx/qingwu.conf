server {
    server_name qingwu.ink www.qingwu.ink;

    # 全站唯一域名是 www：apex 收到的一切（本 server 同时接两个名字）都 301 到 www。
    # 用 server 级 `if + return` 是 nginx 官方明确允许的写法（certbot 自己就生成这种），
    # 换来的是**一个 server 块 + 同一张证书**，不必为 apex 再复制一份 ssl 配置，
    # 也就避开了两个 server 块抢同一个 [::]:443 时 listen 选项要完全一致的坑。
    if ($host = qingwu.ink) {
        return 301 https://www.qingwu.ink$request_uri;
    }

    root   /data/qingwu/dist/client;
    index  index.html;

    limit_conn conn 30;
    limit_req_status 429;
    if ($blocked_ua) { return 444; }

    # CSP 第一阶段：只报告不拦截（Report-Only）。观察一周确认无违规再转正。
    # 'unsafe-inline' 是必须的：站点有 Astro 的 is:inline 脚本和内联样式。
    # img-src 放 https: 是因为友链头像/截图一律外链（不落地到本站）。
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' https:; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;


    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      application/xml image/svg+xml application/rss+xml font/woff2;

    location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }
    location /images/ {
    include /etc/nginx/snippets/security-headers.conf;
        expires off;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 后台静态页：nginx 层先过一道 Basic Auth。
    # 应用层已经有「密码 + 邮件验证码 + IP 锁」，这一层挡的是自动化扫描器 ——
    # 它们连弹窗都过不去，更走不到发验证码那一步（那一步会烧邮箱配额）。
    location ^~ /admin {
        auth_basic           "Qingwu Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        try_files $uri $uri/index.html $uri/ =404;
    }

    location /api/admin/ {
        auth_basic           "Qingwu Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;
        limit_req zone=admin_api burst=5 nodelay;
        access_log /var/log/nginx/admin.log;
        proxy_pass http://127.0.0.1:8787/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Q-Country $geoip2_country_code;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 访客归属地：本地 workerd 的 cf.country 恒等于本机出口地（香港），
        # 只能由 nginx 用 GeoIP 库算好交给 Worker（见 /etc/nginx/conf.d/geoip2.conf）
        proxy_set_header X-Q-Country $geoip2_country_code;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=site burst=100 nodelay;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    include /etc/nginx/snippets/security-headers.conf;
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qingwu.ink/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qingwu.ink/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name qingwu.ink www.qingwu.ink;

    # http 的域名、http 的 www、以及**裸 IP**（default_server 接住任何 Host）
    # 全都一步跳到 https://www，路径和查询串原样带过去。
    # 原来这里还有 certbot 生成的两条 `if ($host = ...) return 301 https://$host...`，
    # 已删：它们会把 qingwu.ink 先送到 apex 的 https 再跳一次 www，白白多一跳。
    return 301 https://www.qingwu.ink$request_uri;




}
