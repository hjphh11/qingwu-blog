# IP → 国家码（供 /api 反代取访客归属地）
#
# 为什么需要它：Worker 跑在本地 workerd 上，`request.cf.country` 恒等于这台机器的
# **出口地**（香港），而不是访客所在地 —— 于是后台的「国家分布」永远只有一个 HK。
# Cloudflare 上那个值由边缘写入，本地没有边缘，只能自己算。
#
# 数据源：DB-IP Lite（CC BY 4.0，免费可商用，需保留署名），文件在
# /var/lib/GeoIP/dbip-country-lite.mmdb，由 /usr/local/bin/update-geoip.sh 每月刷新。
# ⚠️ 不要改用 Debian 的 `geoip-database` 包：数据停在 2019 年（MaxMind 换许可证后就冻结了），
# 近几年的新分配段会全部解析不出来。
geoip2 /var/lib/GeoIP/dbip-country-lite.mmdb {
    $geoip2_country_code country iso_code;
}
