# 限流与恶意 UA 拦截（2026-11-10）
# 额度按「无 CDN、单 IP 正常浏览」估算：一个页面 + 全部资源约 20~40 请求，
# 下面给的是正常访客碰不到、只有脚本才会撞到的阈值。

limit_req_zone $binary_remote_addr zone=site:10m      rate=50r/s;
limit_req_zone $binary_remote_addr zone=api:10m       rate=10r/s;
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# 空 UA 基本是脚本；AI 训练爬虫与扫描器直接拒。
# 注意：Google-Extended / Applebot-Extended 不会出现在 UA 里，只能写 robots.txt。
map $http_user_agent $blocked_ua {
    default 0;
    ""      1;
    ~*(GPTBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Bytespider|meta-externalagent|meta-webindexer|ImagesiftBot|Diffbot|Amazonbot|cohere-ai|TikTokSpider|BokeHubSpider|ApcosysBot|WebBlogGalaxy) 1;
    ~*(sqlmap|Nikto|nmap|masscan|ZmEu|WPScan|dirbuster|gobuster|nuclei|acunetix|Netsparker) 1;
}
