# matrix.qingwu.ink —— 自建 Synapse（清吾长亭之家）
#
# 落点：/etc/nginx/sites-enabled/matrix.conf
# 2026-11-28 起草。**初始只有 80**，等 `certbot --nginx -d matrix.qingwu.ink`
# 跑完，certbot 会自己补 443 + 80→443 的跳转（它改过的行带 `# managed by Certbot`）。
#
# 几个不能省的：
#   - client_max_body_size：Synapse 的 max_upload_size 是 25M，nginx 默认 1M 会先拒
#   - proxy_read_timeout 300s：/sync 是长轮询，默认 60s 会被反复掐断（客户端表现为反复重连）
#   - 不在这里加 limit_req：联邦请求很密，按站点的 api 区限速会误伤
#   - Host 必须原样透传：Synapse 用它校验 server_name 和签名

server {
    listen 80;
    listen [::]:80;
    server_name matrix.qingwu.ink;

    access_log /var/log/nginx/matrix.access.log;
    error_log  /var/log/nginx/matrix.error.log;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /sync 长轮询
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 联邦的 server-to-server 探针走同一入口（不走 8448）
    location ~ ^/_matrix/federation/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 2026-11-28 加：联邦端口 8448。
# 规范上委派到 443 就够，但对方（continuwuity）缓存了「well-known 404」之后会一直退回 8448，
# 而我们没开 8448 就连不上、报 "Unable to acquire your signing key"。开一个一模一样的入口更省事，
# 证书复用 matrix.qingwu.ink 那张（certbot 签在 /etc/letsencrypt/live/matrix.qingwu.ink/）。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8448 ssl http2;
    server_name matrix.qingwu.ink;

    access_log /var/log/nginx/matrix.access.log;
    error_log  /var/log/nginx/matrix.error.log;

    ssl_certificate /etc/letsencrypt/live/matrix.qingwu.ink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.qingwu.ink/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
